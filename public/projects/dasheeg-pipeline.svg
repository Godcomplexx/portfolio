<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1729"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
    <linearGradient id="card4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    <linearGradient id="card5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
    <linearGradient id="card6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" fill="#e2e8f0" font-size="28" font-weight="700" letter-spacing="1">DashEEG — Пайплайн обработки</text>
  <line x1="400" y1="65" x2="800" y2="65" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>

  <!-- === Row 1: 3 cards === -->
  <!-- Card 1: Загрузка -->
  <g filter="url(#shadow)">
    <rect x="40" y="95" width="175" height="130" rx="14" fill="url(#card1)"/>
    <!-- Icon: upload -->
    <circle cx="127" cy="130" r="22" fill="rgba(255,255,255,0.15)"/>
    <path d="M127 120 L127 140 M120 127 L127 120 L134 127" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="118" y1="143" x2="136" y2="143" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <text x="127" y="172" text-anchor="middle" fill="white" font-size="14" font-weight="600">Загрузка</text>
    <text x="127" y="190" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">EDF / CSV</text>
    <text x="127" y="205" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">Выбор каналов</text>
  </g>

  <!-- Arrow 1→2 -->
  <g filter="url(#glow)">
    <line x1="220" y1="160" x2="248" y2="160" stroke="#60a5fa" stroke-width="2.5"/>
    <polygon points="248,154 260,160 248,166" fill="#60a5fa"/>
  </g>

  <!-- Card 2: Фильтрация -->
  <g filter="url(#shadow)">
    <rect x="265" y="95" width="175" height="130" rx="14" fill="url(#card2)"/>
    <!-- Icon: filter wave -->
    <circle cx="352" cy="130" r="22" fill="rgba(255,255,255,0.15)"/>
    <path d="M338 130 Q342 118 346 130 Q350 142 354 130 Q358 118 362 130 Q366 142 367 130" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="352" y="172" text-anchor="middle" fill="white" font-size="14" font-weight="600">Фильтрация</text>
    <text x="352" y="190" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">FIR / Чебышёв II</text>
    <text x="352" y="205" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">Нотч 50 Гц</text>
  </g>

  <!-- Arrow 2→3 -->
  <g filter="url(#glow)">
    <line x1="445" y1="160" x2="473" y2="160" stroke="#a78bfa" stroke-width="2.5"/>
    <polygon points="473,154 485,160 473,166" fill="#a78bfa"/>
  </g>

  <!-- Card 3: Артефакты -->
  <g filter="url(#shadow)">
    <rect x="490" y="95" width="175" height="130" rx="14" fill="url(#card3)"/>
    <!-- Icon: scissors / cut -->
    <circle cx="577" cy="130" r="22" fill="rgba(255,255,255,0.15)"/>
    <path d="M567 122 L587 138 M587 122 L567 138" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="565" cy="140" r="3" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="589" cy="140" r="3" fill="none" stroke="white" stroke-width="1.5"/>
    <text x="577" y="172" text-anchor="middle" fill="white" font-size="14" font-weight="600">Артефакты</text>
    <text x="577" y="190" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">Разметка</text>
    <text x="577" y="205" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">Удаление</text>
  </g>

  <!-- === Row 2: 3 cards === -->
  <!-- Connector: row1 → row2 -->
  <g filter="url(#glow)">
    <path d="M665 160 L700 160 Q720 160 720 180 L720 290 Q720 310 700 310 L690 310" stroke="#22d3ee" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <polygon points="690,304 678,310 690,316" fill="#22d3ee"/>
  </g>

  <!-- Card 4: Сегментация -->
  <g filter="url(#shadow)">
    <rect x="490" y="250" width="175" height="130" rx="14" fill="url(#card4)"/>
    <!-- Icon: segments -->
    <circle cx="577" cy="285" r="22" fill="rgba(255,255,255,0.15)"/>
    <rect x="563" y="277" width="10" height="16" rx="2" fill="none" stroke="white" stroke-width="2"/>
    <rect x="578" y="277" width="10" height="16" rx="2" fill="white" opacity="0.8"/>
    <text x="577" y="327" text-anchor="middle" fill="white" font-size="14" font-weight="600">Сегментация</text>
    <text x="577" y="345" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">ГО / ГЗ</text>
    <text x="577" y="360" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">Аннотации</text>
  </g>

  <!-- Arrow 4→5 (left) -->
  <g filter="url(#glow)">
    <line x1="485" y1="315" x2="457" y2="315" stroke="#34d399" stroke-width="2.5"/>
    <polygon points="457,309 445,315 457,321" fill="#34d399"/>
  </g>

  <!-- Card 5: ICA -->
  <g filter="url(#shadow)">
    <rect x="265" y="250" width="175" height="130" rx="14" fill="url(#card5)"/>
    <!-- Icon: brain/components -->
    <circle cx="352" cy="285" r="22" fill="rgba(255,255,255,0.15)"/>
    <path d="M342 285 Q347 275 352 285 Q357 295 362 285" stroke="white" stroke-width="2" fill="none"/>
    <path d="M342 280 Q347 270 352 280 Q357 290 362 280" stroke="white" stroke-width="1.5" fill="none" opacity="0.5" transform="translate(0,12)"/>
    <text x="352" y="327" text-anchor="middle" fill="white" font-size="14" font-weight="600">ICA</text>
    <text x="352" y="345" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">FastICA / Infomax</text>
    <text x="352" y="360" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">Авто-детекция</text>
  </g>

  <!-- Arrow 5→6 (left) -->
  <g filter="url(#glow)">
    <line x1="260" y1="315" x2="232" y2="315" stroke="#fbbf24" stroke-width="2.5"/>
    <polygon points="232,309 220,315 232,321" fill="#fbbf24"/>
  </g>

  <!-- Card 6: Анализ и экспорт -->
  <g filter="url(#shadow)">
    <rect x="40" y="250" width="175" height="130" rx="14" fill="url(#card6)"/>
    <!-- Icon: chart -->
    <circle cx="127" cy="285" r="22" fill="rgba(255,255,255,0.15)"/>
    <rect x="115" y="283" width="5" height="14" rx="1" fill="white" opacity="0.7"/>
    <rect x="123" y="277" width="5" height="20" rx="1" fill="white"/>
    <rect x="131" y="280" width="5" height="17" rx="1" fill="white" opacity="0.7"/>
    <text x="127" y="327" text-anchor="middle" fill="white" font-size="14" font-weight="600">Анализ</text>
    <text x="127" y="345" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">PSD / IAPF</text>
    <text x="127" y="360" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">Экспорт EDF</text>
  </g>

  <!-- Step numbers -->
  <circle cx="60" cy="110" r="12" fill="rgba(255,255,255,0.2)"/>
  <text x="60" y="115" text-anchor="middle" fill="white" font-size="12" font-weight="700">1</text>
  <circle cx="285" cy="110" r="12" fill="rgba(255,255,255,0.2)"/>
  <text x="285" y="115" text-anchor="middle" fill="white" font-size="12" font-weight="700">2</text>
  <circle cx="510" cy="110" r="12" fill="rgba(255,255,255,0.2)"/>
  <text x="510" y="115" text-anchor="middle" fill="white" font-size="12" font-weight="700">3</text>
  <circle cx="650" cy="265" r="12" fill="rgba(255,255,255,0.2)"/>
  <text x="650" y="270" text-anchor="middle" fill="white" font-size="12" font-weight="700">4</text>
  <circle cx="425" cy="265" r="12" fill="rgba(255,255,255,0.2)"/>
  <text x="425" y="270" text-anchor="middle" fill="white" font-size="12" font-weight="700">5</text>
  <circle cx="200" cy="265" r="12" fill="rgba(255,255,255,0.2)"/>
  <text x="200" y="270" text-anchor="middle" fill="white" font-size="12" font-weight="700">6</text>

  <!-- Decorative dots -->
  <circle cx="820" cy="120" r="2" fill="#3b82f6" opacity="0.3"/>
  <circle cx="860" cy="150" r="3" fill="#7c3aed" opacity="0.2"/>
  <circle cx="900" cy="110" r="2" fill="#0891b2" opacity="0.3"/>
  <circle cx="830" cy="300" r="3" fill="#059669" opacity="0.2"/>
  <circle cx="870" cy="340" r="2" fill="#d97706" opacity="0.3"/>

  <!-- Right side: technology badges -->
  <text x="940" y="130" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">Технологии</text>
  <rect x="850" y="145" width="180" height="32" rx="8" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1"/>
  <text x="940" y="167" text-anchor="middle" fill="#60a5fa" font-size="13">Python + MNE</text>
  <rect x="850" y="185" width="180" height="32" rx="8" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="1"/>
  <text x="940" y="207" text-anchor="middle" fill="#a78bfa" font-size="13">Dash + Plotly</text>
  <rect x="850" y="225" width="180" height="32" rx="8" fill="rgba(8,145,178,0.15)" stroke="#0891b2" stroke-width="1"/>
  <text x="940" y="247" text-anchor="middle" fill="#22d3ee" font-size="13">FastAPI + Redis</text>
  <rect x="850" y="265" width="180" height="32" rx="8" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1"/>
  <text x="940" y="287" text-anchor="middle" fill="#34d399" font-size="13">Docker</text>

  <!-- Bottom info -->
  <text x="940" y="340" text-anchor="middle" fill="#475569" font-size="11">Веб-сервис анализа ЭЭГ</text>
  <text x="940" y="358" text-anchor="middle" fill="#475569" font-size="11">github.com/DashEEG</text>
</svg>