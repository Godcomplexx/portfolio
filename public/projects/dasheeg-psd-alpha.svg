<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="psdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1220"/>
      <stop offset="100%" style="stop-color:#141e33"/>
    </linearGradient>
    <linearGradient id="alphaZone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(168,85,247,0.25)"/>
      <stop offset="100%" style="stop-color:rgba(168,85,247,0.02)"/>
    </linearGradient>
    <linearGradient id="ecFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(59,130,246,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(59,130,246,0.0)"/>
    </linearGradient>
    <linearGradient id="eoFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(239,68,68,0.25)"/>
      <stop offset="100%" style="stop-color:rgba(239,68,68,0.0)"/>
    </linearGradient>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowCard">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#psdBg)" rx="12"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#e2e8f0" font-size="24" font-weight="700">Спектральная плотность мощности (PSD)</text>
  <text x="500" y="62" text-anchor="middle" fill="#64748b" font-size="14">Метод Уэлча — среднее по каналам</text>

  <!-- Chart area -->
  <rect x="120" y="85" width="740" height="400" fill="rgba(255,255,255,0.015)" rx="4" stroke="#1e293b" stroke-width="1"/>

  <!-- Y-axis label -->
  <text x="40" y="290" text-anchor="middle" fill="#94a3b8" font-size="13" transform="rotate(-90,40,290)">Мощность (мкВ²/Гц)</text>

  <!-- X-axis label -->
  <text x="490" y="520" text-anchor="middle" fill="#94a3b8" font-size="13">Частота (Гц)</text>

  <!-- Y-axis grid + labels -->
  <!-- Y: 485 = 0, 85 = max. Range: 400px for power values -->
  <line x1="120" y1="485" x2="860" y2="485" stroke="#1e293b" stroke-width="0.5"/>
  <text x="110" y="490" text-anchor="end" fill="#64748b" font-size="11">0</text>

  <line x1="120" y1="425" x2="860" y2="425" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="110" y="430" text-anchor="end" fill="#64748b" font-size="11">5</text>

  <line x1="120" y1="365" x2="860" y2="365" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="110" y="370" text-anchor="end" fill="#64748b" font-size="11">10</text>

  <line x1="120" y1="305" x2="860" y2="305" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="110" y="310" text-anchor="end" fill="#64748b" font-size="11">15</text>

  <line x1="120" y1="245" x2="860" y2="245" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="110" y="250" text-anchor="end" fill="#64748b" font-size="11">20</text>

  <line x1="120" y1="185" x2="860" y2="185" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="110" y="190" text-anchor="end" fill="#64748b" font-size="11">25</text>

  <line x1="120" y1="125" x2="860" y2="125" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="110" y="130" text-anchor="end" fill="#64748b" font-size="11">30</text>

  <line x1="120" y1="85" x2="860" y2="85" stroke="#1e293b" stroke-width="0.5"/>

  <!-- X-axis grid + labels: 1-20 Hz -->
  <!-- X: 120 = 1Hz, 860 = 20Hz. 740px / 19 steps ≈ 38.9px per Hz -->
  <line x1="120" y1="85" x2="120" y2="490" stroke="#1e293b" stroke-width="0.5"/>
  <text x="120" y="505" text-anchor="middle" fill="#64748b" font-size="11">1</text>

  <line x1="159" y1="85" x2="159" y2="490" stroke="#1e293b" stroke-width="0.3" stroke-dasharray="2,4"/>
  <text x="159" y="505" text-anchor="middle" fill="#475569" font-size="10">2</text>

  <line x1="198" y1="85" x2="198" y2="490" stroke="#1e293b" stroke-width="0.3" stroke-dasharray="2,4"/>
  <text x="198" y="505" text-anchor="middle" fill="#475569" font-size="10">3</text>

  <line x1="237" y1="85" x2="237" y2="490" stroke="#1e293b" stroke-width="0.3" stroke-dasharray="2,4"/>
  <text x="237" y="505" text-anchor="middle" fill="#475569" font-size="10">4</text>

  <line x1="276" y1="85" x2="276" y2="490" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="276" y="505" text-anchor="middle" fill="#64748b" font-size="11">5</text>

  <line x1="315" y1="85" x2="315" y2="490" stroke="#1e293b" stroke-width="0.3" stroke-dasharray="2,4"/>
  <text x="315" y="505" text-anchor="middle" fill="#475569" font-size="10">6</text>

  <line x1="354" y1="85" x2="354" y2="490" stroke="#1e293b" stroke-width="0.3" stroke-dasharray="2,4"/>
  <text x="354" y="505" text-anchor="middle" fill="#475569" font-size="10">7</text>

  <line x1="393" y1="85" x2="393" y2="490" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="393" y="505" text-anchor="middle" fill="#64748b" font-size="11">8</text>

  <line x1="432" y1="85" x2="432" y2="490" stroke="#1e293b" stroke-width="0.3" stroke-dasharray="2,4"/>
  <text x="432" y="505" text-anchor="middle" fill="#475569" font-size="10">9</text>

  <line x1="471" y1="85" x2="471" y2="490" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="471" y="505" text-anchor="middle" fill="#64748b" font-size="11">10</text>

  <line x1="510" y1="85" x2="510" y2="490" stroke="#1e293b" stroke-width="0.3" stroke-dasharray="2,4"/>
  <text x="510" y="505" text-anchor="middle" fill="#475569" font-size="10">11</text>

  <line x1="549" y1="85" x2="549" y2="490" stroke="#1e293b" stroke-width="0.3" stroke-dasharray="2,4"/>
  <text x="549" y="505" text-anchor="middle" fill="#475569" font-size="10">12</text>

  <line x1="588" y1="85" x2="588" y2="490" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="588" y="505" text-anchor="middle" fill="#64748b" font-size="11">13</text>

  <line x1="627" y1="85" x2="627" y2="490" stroke="#1e293b" stroke-width="0.3" stroke-dasharray="2,4"/>
  <text x="627" y="505" text-anchor="middle" fill="#475569" font-size="10">14</text>

  <line x1="666" y1="85" x2="666" y2="490" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="666" y="505" text-anchor="middle" fill="#64748b" font-size="11">15</text>

  <line x1="705" y1="85" x2="705" y2="490" stroke="#1e293b" stroke-width="0.3" stroke-dasharray="2,4"/>
  <text x="705" y="505" text-anchor="middle" fill="#475569" font-size="10">16</text>

  <line x1="744" y1="85" x2="744" y2="490" stroke="#1e293b" stroke-width="0.3" stroke-dasharray="2,4"/>
  <text x="744" y="505" text-anchor="middle" fill="#475569" font-size="10">17</text>

  <line x1="783" y1="85" x2="783" y2="490" stroke="#1e293b" stroke-width="0.3" stroke-dasharray="2,4"/>
  <text x="783" y="505" text-anchor="middle" fill="#475569" font-size="10">18</text>

  <line x1="822" y1="85" x2="822" y2="490" stroke="#1e293b" stroke-width="0.3" stroke-dasharray="2,4"/>
  <text x="822" y="505" text-anchor="middle" fill="#475569" font-size="10">19</text>

  <line x1="860" y1="85" x2="860" y2="490" stroke="#1e293b" stroke-width="0.5"/>
  <text x="860" y="505" text-anchor="middle" fill="#64748b" font-size="11">20</text>

  <!-- Alpha band highlight (8-13 Hz) -->
  <rect x="393" y="85" width="195" height="400" fill="url(#alphaZone)" rx="2"/>
  <text x="490" y="100" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="600" opacity="0.8">α-диапазон (8–13 Гц)</text>

  <!-- Frequency band labels at top -->
  <text x="198" y="79" text-anchor="middle" fill="#475569" font-size="10">δ</text>
  <text x="315" y="79" text-anchor="middle" fill="#475569" font-size="10">θ</text>
  <text x="490" y="79" text-anchor="middle" fill="#a855f7" font-size="11" font-weight="600">α</text>
  <text x="647" y="79" text-anchor="middle" fill="#475569" font-size="10">β</text>

  <!-- EC curve (blue) - Eyes Closed - strong alpha peak -->
  <!-- Points: 1Hz=120, each Hz ≈39px. Power: 485=0, each unit=12px -->
  <!-- EC: delta high, theta moderate, BIG alpha peak at ~10Hz, then drops -->
  <path d="M120,305
           C139,317 159,340 178,355
           C198,365 218,370 237,372
           C257,373 276,372 296,368
           C315,362 335,350 354,335
           C373,310 383,280 393,240
           C403,195 413,155 423,125
           C433,110 443,100 453,95
           C463,100 471,110 480,130
           C490,160 500,195 510,235
           C520,275 530,310 549,340
           C568,365 588,385 608,400
           C627,410 647,418 666,425
           C686,430 705,435 725,440
           C744,443 764,446 783,449
           C803,451 822,453 841,455
           L860,456"
          stroke="#3b82f6" stroke-width="2.5" fill="none" filter="url(#glowBlue)"/>

  <!-- EC fill under curve -->
  <path d="M120,305
           C139,317 159,340 178,355
           C198,365 218,370 237,372
           C257,373 276,372 296,368
           C315,362 335,350 354,335
           C373,310 383,280 393,240
           C403,195 413,155 423,125
           C433,110 443,100 453,95
           C463,100 471,110 480,130
           C490,160 500,195 510,235
           C520,275 530,310 549,340
           C568,365 588,385 608,400
           C627,410 647,418 666,425
           C686,430 705,435 725,440
           C744,443 764,446 783,449
           C803,451 822,453 841,455
           L860,456 L860,485 L120,485 Z"
          fill="url(#ecFill)" opacity="0.5"/>

  <!-- EO curve (red) - Eyes Open - suppressed alpha (no peak) -->
  <path d="M120,340
           C139,352 159,370 178,380
           C198,388 218,393 237,396
           C257,398 276,400 296,402
           C315,404 335,407 354,410
           C373,413 393,418 413,422
           C432,425 452,428 471,432
           C490,435 510,438 530,442
           C549,445 568,448 588,450
           C608,452 627,454 647,456
           C666,457 686,459 705,460
           C725,461 744,462 764,463
           C783,464 803,465 822,466
           L860,467"
          stroke="#ef4444" stroke-width="2.5" fill="none" filter="url(#glowRed)"/>

  <!-- EO fill under curve -->
  <path d="M120,340
           C139,352 159,370 178,380
           C198,388 218,393 237,396
           C257,398 276,400 296,402
           C315,404 335,407 354,410
           C373,413 393,418 413,422
           C432,425 452,428 471,432
           C490,435 510,438 530,442
           C549,445 568,448 588,450
           C608,452 627,454 647,456
           C666,457 686,459 705,460
           C725,461 744,462 764,463
           C783,464 803,465 822,466
           L860,467 L860,485 L120,485 Z"
          fill="url(#eoFill)" opacity="0.4"/>

  <!-- IAPF marker (arrow pointing to alpha peak at ~10.2 Hz) -->
  <!-- 10.2 Hz ≈ 120 + 9.2*39 = 120 + 359 = 479 -->
  <line x1="453" y1="95" x2="453" y2="70" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="453" cy="95" r="5" fill="none" stroke="#fbbf24" stroke-width="2"/>

  <!-- IAPF label card -->
  <g filter="url(#shadowCard)">
    <rect x="380" y="35" width="146" height="30" rx="8" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="453" y="55" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">IAPF = 10.2 Гц</text>
  </g>

  <!-- Legend -->
  <g filter="url(#shadowCard)">
    <rect x="680" y="120" width="170" height="90" rx="10" fill="rgba(15,23,42,0.9)" stroke="#1e293b" stroke-width="1"/>
    <text x="765" y="142" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">Легенда</text>

    <line x1="695" y1="158" x2="725" y2="158" stroke="#3b82f6" stroke-width="2.5"/>
    <circle cx="710" cy="158" r="3" fill="#3b82f6"/>
    <text x="735" y="163" fill="#60a5fa" font-size="12">Глаза закрыты (ГЗ)</text>

    <line x1="695" y1="180" x2="725" y2="180" stroke="#ef4444" stroke-width="2.5"/>
    <circle cx="710" cy="180" r="3" fill="#ef4444"/>
    <text x="735" y="185" fill="#f87171" font-size="12">Глаза открыты (ГО)</text>

    <rect x="695" y="193" width="10" height="10" fill="rgba(168,85,247,0.25)" stroke="#a855f7" stroke-width="0.5" rx="1"/>
    <text x="735" y="202" fill="#a78bfa" font-size="12">α-диапазон</text>
  </g>

  <!-- Bottom info cards -->
  <!-- Card 1: What is IAPF -->
  <g filter="url(#shadowCard)">
    <rect x="120" y="540" width="230" height="48" rx="10" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="0.8"/>
    <text x="235" y="560" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">IAPF</text>
    <text x="235" y="578" text-anchor="middle" fill="#94a3b8" font-size="11">Индивидуальная альфа-частота</text>
  </g>

  <!-- Card 2: Alpha reactivity -->
  <g filter="url(#shadowCard)">
    <rect x="370" y="540" width="260" height="48" rx="10" fill="rgba(168,85,247,0.08)" stroke="#a855f7" stroke-width="0.8"/>
    <text x="500" y="560" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">Альфа-реактивность</text>
    <text x="500" y="578" text-anchor="middle" fill="#94a3b8" font-size="11">Подавление α при открытии глаз</text>
  </g>

  <!-- Card 3: Method -->
  <g filter="url(#shadowCard)">
    <rect x="650" y="540" width="210" height="48" rx="10" fill="rgba(59,130,246,0.08)" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="755" y="560" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">Метод Уэлча</text>
    <text x="755" y="578" text-anchor="middle" fill="#94a3b8" font-size="11">Оценка спектральной плотности</text>
  </g>
</svg>